name: ORCID publication review

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 5 * *'

permissions:
  contents: read

concurrency:
  group: orcid-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python scripts/orcid_review.py --output orcid-review.json
      - uses: actions/upload-artifact@v4
        with:
          name: orcid-review
          path: orcid-review.json
          if-no-files-found: error
